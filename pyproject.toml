[project]
name = "indian-farmer-scheme-assistant"
version = "1.0.0"
description = "Citation-grounded retrieval assistant for Indian farmer schemes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Divya Rachala" }]
dependencies = [
  "beautifulsoup4>=4.13",
  "joblib>=1.4",
  "numpy>=2.0",
  "pypdf>=5.3",
  "requests>=2.32",
  "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
